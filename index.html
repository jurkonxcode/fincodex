<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="Fincodex — Live Code Editor untuk Android">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fincodex">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Fincodex — Live Code Editor</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- ==================== HEADER ==================== -->
  <header class="app-header">
    <div class="app-logo" aria-hidden="true">&lt;/&gt;</div>
    <div class="app-brand">
      <h1>Fincodex</h1>
      <p>Live Code Editor</p>
    </div>
    <div class="app-actions">
      <button id="btnReset" class="icon-btn" aria-label="Reset kode">↺</button>
      <button id="btnExport" class="icon-btn" aria-label="Export kode">⬇</button>
    </div>
  </header>

  <!-- ==================== LANGUAGE TABS ==================== -->
  <nav class="lang-tabs" role="tablist" aria-label="Pilih bahasa">
    <button class="lang-tab active" role="tab" data-lang="html">HTML</button>
    <button class="lang-tab" role="tab" data-lang="css">CSS</button>
    <button class="lang-tab" role="tab" data-lang="js">JS</button>
  </nav>

  <!-- ==================== MAIN ==================== -->
  <main class="app-main">

    <!-- Editor Section -->
    <section class="panel panel-editor" aria-label="Editor kode">
      <textarea
        id="editor"
        class="editor"
        spellcheck="false"
        autocapitalize="off"
        autocorrect="off"
        placeholder="Tulis kode di sini..."
        aria-label="Area kode"></textarea>
    </section>

    <!-- Output Section -->
    <section class="panel panel-output" aria-label="Hasil">
      <div class="output-tabs" role="tablist">
        <button class="out-tab active" role="tab" data-view="preview">Preview</button>
        <button class="out-tab" role="tab" data-view="console">Console</button>
        <span class="status-badge" id="status">Ready</span>
      </div>
      <div class="output-body">
        <iframe
          id="preview"
          class="preview"
          sandbox="allow-scripts allow-modals allow-forms allow-popups"
          title="Preview hasil kode"></iframe>
        <div id="console" class="console hidden" role="log" aria-live="polite"></div>
      </div>
    </section>

  </main>

  <!-- ==================== SCRIPTS ==================== -->
  <script src="js/state.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/console.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
